<div class="subpage active">
  <div class="page-header">
    <div class="breadcrumb">
      <span [routerLink]="['/dashboard']" style="cursor:pointer">Dashboard</span>
      <span class="breadcrumb-sep">/</span>
      <span [routerLink]="['/testimonials']" style="cursor:pointer">Testimonials</span>
      <span class="breadcrumb-sep">/</span>
      <span>Create testimonial</span>
    </div>
    <h2>Create New Testimonial</h2>
    <p>Add a new success story or feedback from a platform user.</p>
  </div>

  <div class="card card-pad" style="max-width: 800px;">
    <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
      
      <!-- Client Selector (Searchable Dropdown) -->
      <div class="fi full-width" style="grid-column: span 2; position: relative;">
        <label class="fl">Client / User</label>
        <div class="srch-wrap" style="width: 100%;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px; height:16px; color:var(--muted);"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input 
            type="text" 
            class="srch-inp" 
            [(ngModel)]="searchTerm" 
            (input)="filterUsers(); showUserDropdown = true" 
            (focus)="showUserDropdown = true"
            placeholder="Search users by name or email..."
          >
        </div>
        
        <!-- Dropdown Menu -->
        <div *ngIf="showUserDropdown && filteredUsers.length > 0" class="dd-menu open" style="top: 100%; left: 0; right: 0; width: 100%; max-height: 250px; overflow-y: auto; z-index: 100;">
          <div 
            *ngFor="let user of filteredUsers" 
            class="dd-item" 
            (click)="selectUser(user)"
            style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 15px;"
          >
            <div style="font-weight: 600;">{{ user.firstName }} {{ user.lastName }}</div>
            <div style="font-size: 11px; color: var(--muted);">{{ user.email }}</div>
          </div>
        </div>
        <div *ngIf="showUserDropdown && filteredUsers.length === 0 && !isLoadingUsers" class="dd-menu open" style="top: 100%; left: 0; right: 0; width: 100%; padding: 15px; text-align: center; color: var(--muted); font-size: 13px;">
          No users found matches "{{ searchTerm }}"
        </div>
      </div>

      <div class="fi">
        <label class="fl">Author name (display name)</label>
        <input class="si-input" type="text" [(ngModel)]="testimonialForm.authorName" placeholder="e.g. Anonymous or John D.">
      </div>

      <div class="fi">
        <label class="fl">Country</label>
        <input class="si-input" type="text" [(ngModel)]="testimonialForm.country" placeholder="e.g. United Kingdom">
      </div>

      <div class="fi">
        <label class="fl">Scam type involved</label>
        <input class="si-input" type="text" [(ngModel)]="testimonialForm.scamType" placeholder="e.g. Crypto Investment">
      </div>

      <div class="fi">
        <label class="fl">Rating (1-5)</label>
        <select class="si-input" [(ngModel)]="testimonialForm.rating">
          <option [value]="5">5 Stars - Excellent</option>
          <option [value]="4">4 Stars - Very Good</option>
          <option [value]="3">3 Stars - Good</option>
          <option [value]="2">2 Stars - Fair</option>
          <option [value]="1">1 Star - Poor</option>
        </select>
      </div>

      <div class="fi full-width" style="grid-column: span 2;">
        <label class="fl">Testimonial content</label>
        <textarea class="si-input" rows="5" [(ngModel)]="testimonialForm.content" placeholder="Share the recovery story or feedback..."></textarea>
      </div>

      <div class="fi full-width" style="grid-column: span 2;">
        <label class="fl">Video URL (optional)</label>
        <input class="si-input" type="url" [(ngModel)]="testimonialForm.videoUrl" placeholder="https://youtube.com/watch?v=...">
      </div>

      <div class="fi" style="display: flex; align-items: center; gap: 10px; padding-top: 10px;">
        <input type="checkbox" id="approved" [(ngModel)]="testimonialForm.approved" style="width: 18px; height: 18px; accent-color: var(--accent);">
        <label for="approved" style="font-size: 14px; font-weight: 600; cursor: pointer;">Approve immediately</label>
      </div>

    </div>

    <div class="fta" style="margin-top: 30px; display: flex; gap: 12px; justify-content: flex-end; border-top: 1px solid var(--border); padding-top: 20px;">
      <button class="btn-ol" [routerLink]="['/testimonials']">Cancel</button>
      <button class="btn-primary" (click)="save()" [disabled]="isSaving">
        <span *ngIf="!isSaving">Create Testimonial</span>
        <span *ngIf="isSaving">Saving...</span>
      </button>
    </div>
  </div>
</div>

<!-- Overlay to close dropdown when clicking outside -->
<div *ngIf="showUserDropdown" style="position: fixed; inset: 0; z-index: 90;" (click)="showUserDropdown = false"></div>
