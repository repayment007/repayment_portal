<div class="subpage active">
  <div class="page-header">
    <div class="breadcrumb">
      <span [routerLink]="['/dashboard']" style="cursor:pointer">Dashboard</span>
      <span class="breadcrumb-sep">/</span>
      <span [routerLink]="['/casenotes']" style="cursor:pointer">Case Notes</span>
      <span class="breadcrumb-sep">/</span>
      <span>Create Note</span>
    </div>
    <div style="display:flex; justify-content: space-between; align-items: center;">
      <div>
        <h2>Create Case Note</h2>
        <p>Fill in the details below to add a new note to a case.</p>
      </div>
      <button class="btn-ol" [routerLink]="['/casenotes']">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to List
      </button>
    </div>
  </div>

  <div class="card card-pad">
    <div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Note Details
    </div>

    <div class="form-grid">
      <div class="fg">
        <label class="fl">Case ID</label>
        <input type="text" class="fi" [(ngModel)]="noteForm.caseId" placeholder="e.g. CASE-1001">
      </div>
      <div class="fg">
        <label class="fl">Author</label>
        <input type="text" class="fi" [(ngModel)]="noteForm.author" placeholder="Your Name">
      </div>
      <div class="fg">
        <label class="fl">Status</label>
        <select class="fs" [(ngModel)]="noteForm.status">
          @for (status of statuses; track status) {
            <option [value]="status">{{ status | titlecase }}</option>
          }
        </select>
      </div>
      <div class="fg">
        <label class="fl">Date</label>
        <input type="date" class="fi" [(ngModel)]="noteForm.date">
      </div>
      <div class="fg full">
        <label class="fl">Content</label>
        <textarea class="fta" [(ngModel)]="noteForm.content" placeholder="Enter detailed note content..." style="min-height: 150px;"></textarea>
      </div>
    </div>

    <div class="form-footer">
      <button class="btn-ghost" [routerLink]="['/casenotes']">Cancel</button>
      <button class="btn-primary" (click)="saveNote()">Save Note</button>
    </div>
  </div>
</div>
