<div class="subpage active">
  <div class="page-header">
    <div class="breadcrumb">
      <span [routerLink]="['/dashboard']" style="cursor:pointer">Dashboard</span>
      <span class="breadcrumb-sep">/</span>
      <span [routerLink]="['/health']" style="cursor:pointer">Health Records</span>
      <span class="breadcrumb-sep">/</span>
      <span>{{ record.clientName }}</span>
    </div>
    <div style="display:flex; justify-content: space-between; align-items: center;">
      <div>
        <h2>Health Record: {{ record.clientName }}</h2>
        <p>Detailed health assessment and result information.</p>
      </div>
      <div style="display:flex; gap: 12px;">
        <button class="btn-ol" [routerLink]="['/health']">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Back to List
        </button>
        <button class="btn-primary" [routerLink]="['/health', record.id, 'edit']">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Edit Record
        </button>
      </div>
    </div>
  </div>

  <div class="card card-pad">
    <div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      Record Details
    </div>

    <div class="info-grid">
      <div class="ig-item">
        <label>Client Name</label>
        <div>{{ record.clientName }}</div>
      </div>
      <div class="ig-item">
        <label>Checkup Type</label>
        <div>{{ record.checkupType }}</div>
      </div>
      <div class="ig-item">
        <label>Status</label>
        <div><span class="pill" [ngClass]="getStatusClass(record.status)">{{ record.status }}</span></div>
      </div>
      <div class="ig-item">
        <label>Date</label>
        <div>{{ record.date }}</div>
      </div>
      <div class="ig-item">
        <label>Result</label>
        <div>{{ record.result }}</div>
      </div>
      <div class="ig-item full">
        <label>Notes</label>
        <div style="line-height: 1.6; max-width: 800px;">{{ record.notes }}</div>
      </div>
    </div>
  </div>
</div>
