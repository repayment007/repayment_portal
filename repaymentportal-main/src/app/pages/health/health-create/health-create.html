<div class="subpage active">
  <div class="page-header">
    <div class="breadcrumb">
      <span [routerLink]="['/dashboard']" style="cursor:pointer">Dashboard</span>
      <span class="breadcrumb-sep">/</span>
      <span [routerLink]="['/health']" style="cursor:pointer">Health Records</span>
      <span class="breadcrumb-sep">/</span>
      <span>Add Record</span>
    </div>
    <div style="display:flex; justify-content: space-between; align-items: center;">
      <div>
        <h2>Add New Health Record</h2>
        <p>Enter the health assessment details below.</p>
      </div>
      <button class="btn-ol" [routerLink]="['/health']">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to Records
      </button>
    </div>
  </div>

  <div class="card card-pad">
    <div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Record Details
    </div>
    
    <div class="form-grid">
      <div class="fg">
        <label class="fl">Client Name</label>
        <input type="text" class="fi" [(ngModel)]="recordForm.clientName" placeholder="Full Name">
      </div>
      <div class="fg">
        <label class="fl">Checkup Type</label>
        <select class="fs" [(ngModel)]="recordForm.checkupType">
          @for (type of checkupTypes; track type) {
            <option [value]="type">{{ type }}</option>
          }
        </select>
      </div>
      <div class="fg">
        <label class="fl">Status</label>
        <select class="fs" [(ngModel)]="recordForm.status">
          @for (status of statuses; track status) {
            <option [value]="status">{{ status }}</option>
          }
        </select>
      </div>
      <div class="fg">
        <label class="fl">Date</label>
        <input type="date" class="fi" [(ngModel)]="recordForm.date">
      </div>
      <div class="fg full">
        <label class="fl">Result</label>
        <input type="text" class="fi" [(ngModel)]="recordForm.result" placeholder="e.g. Healthy, Normal, etc.">
      </div>
      <div class="fg full">
        <label class="fl">Notes</label>
        <textarea class="fta" [(ngModel)]="recordForm.notes" placeholder="Enter additional notes..."></textarea>
      </div>
    </div>

    <div class="form-footer">
      <button class="btn-ghost" [routerLink]="['/health']">Cancel</button>
      <button class="btn-primary" (click)="saveRecord()">Create Record</button>
    </div>
  </div>
</div>
