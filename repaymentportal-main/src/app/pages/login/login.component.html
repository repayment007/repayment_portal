<div id="page-signin">
  <div class="signin-wrap">
    <div class="signin-card">
      <div class="org-logo">
        <img src="assets/img/repayment-icon.png" alt="Repayment Logo" style="width:100%; height:100%; object-fit:contain;"/>
      </div>
      <div class="org-name">Repayment</div>
      <div class="org-tag">Admin Management Portal</div>

      <div *ngIf="errorMessage" style="background:rgba(192,57,43,0.1); color:var(--danger); padding:10px; border-radius:8px; margin-bottom:16px; font-size:13px; text-align:center;">
        {{ errorMessage }}
      </div>

      <div class="si-group">
        <label class="si-label">Email Address</label>
        <input class="si-input" type="email" [(ngModel)]="credentials.email" placeholder="admin@hopeforward.org" [disabled]="isLoading"/>
      </div>
      <div class="si-group">
        <label class="si-label">Password</label>
        <input class="si-input" type="password" [(ngModel)]="credentials.password" placeholder="••••••••" [disabled]="isLoading"/>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-size:13px;">
        <label style="display:flex;align-items:center;gap:7px;cursor:pointer;color:var(--muted);"><input type="checkbox" checked style="accent-color:var(--accent);"/>Remember me</label>
        <span style="color:var(--accent);cursor:pointer;font-weight:600;">Forgot password?</span>
      </div>

      <button class="btn-signin" (click)="doSignIn()" [disabled]="isLoading">
        <span *ngIf="!isLoading">Sign In to Portal</span>
        <span *ngIf="isLoading">Authenticating...</span>
      </button>

      <p style="text-align:center;margin-top:18px;font-size:12px;color:var(--muted);">REPAY REPAYMENT &nbsp;·&nbsp; Secure Admin Access &nbsp;·&nbsp; SSL Encrypted</p>
    </div>
  </div>
</div>
