<div class="subpage active">
  <div class="page-header">
    <div class="breadcrumb">
      <span [routerLink]="['/dashboard']" style="cursor:pointer">Dashboard</span>
      <span class="breadcrumb-sep">/</span>
      <span [routerLink]="['/consultations']" style="cursor:pointer">Consultations</span>
      <span class="breadcrumb-sep">/</span>
      <span [routerLink]="['/consultations', consultationId]" style="cursor:pointer">View Details</span>
      <span class="breadcrumb-sep">/</span>
      <span>Edit</span>
    </div>
    <div style="display:flex; justify-content: space-between; align-items: center;">
      <div>
        <h2>Edit Consultation</h2>
        <p>Update the details of the consultation session.</p>
      </div>
      <button class="btn-ol" [routerLink]="['/consultations', consultationId]">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to Details
      </button>
    </div>
  </div>

  <div class="card card-pad" *ngIf="loading" style="text-align: center; padding: 40px;">
    <p>Loading consultation details...</p>
  </div>

  <div class="card card-pad" *ngIf="!loading">
    <div *ngIf="errorMsg" style="color: red; margin-bottom: 20px; padding: 12px; background: rgba(231, 76, 60, 0.1); border-radius: 8px;">
      {{ errorMsg }}
    </div>

    <div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Consultation Details
    </div>
    
    <div class="form-grid">
      <div class="fg">
        <label class="fl">First Name</label>
        <input type="text" class="fi" [(ngModel)]="consultationForm.firstName">
      </div>
      <div class="fg">
        <label class="fl">Last Name</label>
        <input type="text" class="fi" [(ngModel)]="consultationForm.lastName">
      </div>
      <div class="fg">
        <label class="fl">Email</label>
        <input type="email" class="fi" [(ngModel)]="consultationForm.email">
      </div>
      <div class="fg">
        <label class="fl">Phone</label>
        <input type="text" class="fi" [(ngModel)]="consultationForm.phone">
      </div>
      <div class="fg">
        <label class="fl">Case Type</label>
        <input type="text" class="fi" [(ngModel)]="consultationForm.caseType">
      </div>
      <div class="fg">
        <label class="fl">Scam Type</label>
        <input type="text" class="fi" [(ngModel)]="consultationForm.scamType">
      </div>
      <div class="fg">
        <label class="fl">Amount Lost ($)</label>
        <input type="number" class="fi" [(ngModel)]="consultationForm.amountLost">
      </div>
      <div class="fg">
        <label class="fl">Scheduled For</label>
        <input type="datetime-local" class="fi" [(ngModel)]="consultationForm.scheduledAt">
      </div>
      <div class="fg">
        <label class="fl">Consultant Assigned</label>
        <select class="fs" [(ngModel)]="consultationForm.handledBy">
          <option [ngValue]="null">Unassigned</option>
          @for (admin of admins; track admin.id) {
            <option [value]="admin.id">{{ admin.firstName }} {{ admin.lastName }}</option>
          }
        </select>
      </div>
      <div class="fg">
        <label class="fl">Status</label>
        <select class="fs" [(ngModel)]="consultationForm.status">
          @for (status of statuses; track status) {
            <option [value]="status">{{ status | titlecase }}</option>
          }
        </select>
      </div>
      <div class="fg full">
        <label class="fl">Message (Read Only)</label>
        <div style="padding: 12px; background: var(--bg-hover); border-radius: 8px; font-size: 14px; white-space: pre-wrap;">{{ consultationForm.message }}</div>
      </div>
      <div class="fg full">
        <label class="fl">Internal Notes</label>
        <textarea class="fta" [(ngModel)]="consultationForm.notes" placeholder="Add internal notes about this consultation..."></textarea>
      </div>
    </div>

    <div class="form-footer">
      <button class="btn-ghost" [routerLink]="['/consultations', consultationId]">Cancel</button>
      <button class="btn-primary" (click)="save()">Save Changes</button>
    </div>
  </div>
</div>
