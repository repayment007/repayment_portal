<div class="subpage active">
  <div class="page-header">
    <div class="breadcrumb">
      <span [routerLink]="['/dashboard']" style="cursor:pointer">Dashboard</span>
      <span class="breadcrumb-sep">/</span>
      <span [routerLink]="['/cases']" style="cursor:pointer">Cases</span>
      <span class="breadcrumb-sep">/</span>
      <span>Create Case</span>
    </div>
    <div style="display:flex; justify-content: space-between; align-items: center;">
      <div>
        <h2>Create New Case</h2>
        <p>Enter the details for the new case below.</p>
      </div>
      <button class="btn-ol" [routerLink]="['/cases']">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to Cases
      </button>
    </div>
  </div>

  <div class="card card-pad">
    <div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Case Details
    </div>
    
    <div class="form-grid">
      <div class="fg">
        <label class="fl">Case Number</label>
        <input type="text" class="fi" [(ngModel)]="caseForm.caseNumber" placeholder="e.g. CASE-1001">
      </div>
      <div class="fg">
        <label class="fl">Client Name</label>
        <input type="text" class="fi" [(ngModel)]="caseForm.clientName" placeholder="Full Name">
      </div>
      <div class="fg">
        <label class="fl">Case Type</label>
        <select class="fs" [(ngModel)]="caseForm.type">
          @for (type of caseTypes; track type) {
            <option [value]="type">{{ type }}</option>
          }
        </select>
      </div>
      <div class="fg">
        <label class="fl">Status</label>
        <select class="fs" [(ngModel)]="caseForm.status">
          @for (status of caseStatuses; track status) {
            <option [value]="status">{{ status | titlecase }}</option>
          }
        </select>
      </div>
      <div class="fg">
        <label class="fl">Opened Date</label>
        <input type="date" class="fi" [(ngModel)]="caseForm.openedDate">
      </div>
      <div class="fg full">
        <label class="fl">Description</label>
        <textarea class="fta" [(ngModel)]="caseForm.description" placeholder="Enter case summary and objectives..."></textarea>
      </div>
    </div>

    <div class="form-footer">
      <button class="btn-ghost" [routerLink]="['/cases']">Cancel</button>
      <button class="btn-primary" (click)="saveCase()">Create Case</button>
    </div>
  </div>
</div>
