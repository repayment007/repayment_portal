<div class="subpage active">
  <div class="page-header">
    <div class="breadcrumb">
      <span [routerLink]="['/dashboard']" style="cursor:pointer">Dashboard</span>
      <span class="breadcrumb-sep">/</span>
      <span [routerLink]="['/admin']" style="cursor:pointer">Admins</span>
      <span class="breadcrumb-sep">/</span>
      <span>Add Admin</span>
    </div>
    <div style="display:flex; justify-content: space-between; align-items: center;">
      <div>
        <h2>Add New Administrator</h2>
        <p>Create a new administrative user with specific roles and access.</p>
      </div>
      <button class="btn-ol" [routerLink]="['/admin']">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to List
      </button>
    </div>
  </div>

  <div class="card card-pad">
    <div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Admin Details
    </div>
    
    <div class="form-grid">
      <div class="fg">
        <label class="fl">Full Name</label>
        <input type="text" class="fi" [(ngModel)]="adminForm.name" placeholder="John Doe">
      </div>
      <div class="fg">
        <label class="fl">Email Address</label>
        <input type="email" class="fi" [(ngModel)]="adminForm.email" placeholder="john@example.com">
      </div>
      <div class="fg">
        <label class="fl">Role</label>
        <select class="fs" [(ngModel)]="adminForm.role">
          @for (role of roles; track role) {
            <option [value]="role">{{ role }}</option>
          }
        </select>
      </div>
      <div class="fg">
        <label class="fl">Status</label>
        <select class="fs" [(ngModel)]="adminForm.status">
          @for (status of statuses; track status) {
            <option [value]="status">{{ status }}</option>
          }
        </select>
      </div>
      <div class="fg full">
        <label class="fl">Initial Password</label>
        <input type="password" class="fi" [(ngModel)]="adminForm.password" placeholder="••••••••">
      </div>
    </div>

    <div class="form-footer">
      <button class="btn-ghost" [routerLink]="['/admin']">Cancel</button>
      <button class="btn-primary" (click)="saveAdmin()">Create Admin</button>
    </div>
  </div>
</div>
