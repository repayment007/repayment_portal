<div class="subpage active">
  <div class="page-header">
    <div class="breadcrumb">
      <span [routerLink]="['/dashboard']" style="cursor:pointer">Dashboard</span>
      <span class="breadcrumb-sep">/</span>
      <span [routerLink]="['/admin']" style="cursor:pointer">Admins</span>
      <span class="breadcrumb-sep">/</span>
      <span>{{ admin.name }}</span>
    </div>
    <div style="display:flex; justify-content: space-between; align-items: center;">
      <div>
        <h2>Admin: {{ admin.name }}</h2>
        <p>Detailed administrative user profile and permissions.</p>
      </div>
      <div style="display:flex; gap: 12px;">
        <button class="btn-ol" [routerLink]="['/admin']">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Back to List
        </button>
        <button class="btn-primary" [routerLink]="['/admin', admin.id, 'edit']">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Edit Admin
        </button>
      </div>
    </div>
  </div>

  <div class="card card-pad">
    <div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      Admin Information
    </div>

    <div class="info-grid">
      <div class="ig-item">
        <label>Full Name</label>
        <div>{{ admin.name }}</div>
      </div>
      <div class="ig-item">
        <label>Email Address</label>
        <div>{{ admin.email }}</div>
      </div>
      <div class="ig-item">
        <label>Role</label>
        <div>{{ admin.role }}</div>
      </div>
      <div class="ig-item">
        <label>Status</label>
        <div><span class="pill" [ngClass]="getStatusClass(admin.status)">{{ admin.status }}</span></div>
      </div>
      <div class="ig-item">
        <label>Last Login</label>
        <div>{{ admin.lastLogin }}</div>
      </div>
      <div class="ig-item">
        <label>Permissions</label>
        <div>{{ admin.permissions }}</div>
      </div>
    </div>
  </div>
</div>
